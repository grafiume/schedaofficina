<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>ELIP • Chiusura Officina</title><link rel="apple-touch-icon" href="icons/icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:auto;padding:18px 16px 45px}.head{text-align:center;margin:8px 0 18px}.head img{width:82px;border-radius:12px}.head h1{font-size:25px;margin:9px 0 3px}.head p{margin:0;color:#666;font-size:14px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.search{position:relative}.search input{width:100%;height:56px;border:1px solid #c9c9c9;border-radius:15px;padding:0 16px;font:inherit;font-size:16px;background:#fff}.count{font-size:13px;color:#666;margin:10px 3px}.job{background:#fff;border:1px solid #e4e4e4;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 1px 6px #0000000a;cursor:pointer}.jobtop{display:flex;justify-content:space-between;gap:10px}.jobmain{display:flex;gap:12px;min-width:0;flex:1}.thumbbox{width:82px;height:82px;flex:0 0 82px;border-radius:13px;background:#f0f0f0;border:1px solid #e2e2e2;overflow:hidden}.thumb{display:block;width:100%;height:100%;object-fit:cover}.thumb.empty{visibility:hidden}.jobtext{min-width:0;flex:1}.detailPhoto{display:none;width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:#f2f2f2;margin:13px 0}.cliente{font-size:18px;font-weight:850;text-transform:uppercase}.desc{font-size:14px;color:#444;margin-top:4px;text-transform:uppercase}.badge{display:inline-block;background:#ffd21f;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800;margin-top:8px}.meta{font-size:13px;color:#666;line-height:1.45;margin-top:8px}.arrow{font-size:26px;margin-top:16px}.hidden{display:none!important}.back{border:0;background:#eee;border-radius:12px;padding:10px 14px;font-weight:750;font-size:15px}.detailTitle{font-size:22px;font-weight:850;text-transform:uppercase;margin:14px 0 3px}.detailDesc{text-transform:uppercase;color:#444;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.field label,.notes label{display:block;font-size:12px;font-weight:750;color:#666;margin:0 0 5px}.box{min-height:52px;border:1px solid #ccc;border-radius:12px;padding:14px;background:#fff;font-size:15px}.notes{margin-top:14px}.notes textarea{width:100%;min-height:112px;border:1px solid #ccc;border-radius:12px;padding:13px;font:inherit;font-size:16px;text-transform:uppercase}.greenpanel{background:#ecf9f0;border:1px solid #cdeed7;border-radius:15px;padding:14px;margin-top:15px}.complete{width:100%;border:0;border-radius:15px;background:#0aad4b;color:#fff;padding:17px 12px;font-size:18px;font-weight:850;margin-top:14px}.complete:disabled{opacity:.55}.original{display:block;text-align:center;text-decoration:none;color:#1769e0;font-weight:750;border:1px solid #1769e0;border-radius:13px;padding:13px;margin-top:11px}.msg{display:none;border-radius:12px;padding:12px;margin-top:12px;font-weight:750}.ok{display:block;background:#e9f8ee;color:#176b36}.err{display:block;background:#fff0f0;color:#9d2222}.login input{width:100%;height:52px;border:1px solid #ccc;border-radius:12px;padding:12px;font:inherit;margin:6px 0}.login button{width:100%;border:0;border-radius:13px;padding:14px;background:#1769e0;color:#fff;font-weight:800;margin-top:8px}.empty{text-align:center;color:#777;padding:28px 10px}</style></head><body><div class="wrap">
<div class="head"><img src="logo-elip.jpg"><h1>Chiusura Officina</h1><p>Cerca la lavorazione e marcala come completata</p></div>
<div id="login" class="card login hidden"><b>Accesso Officina</b><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">ACCEDI</button><div id="loginMsg" class="count"></div></div>
<section id="listView" class="hidden"><div class="card"><div class="search"><input id="q" placeholder="Cerca cliente, macchina, DDT o ID…" autocomplete="off"></div><div id="count" class="count">Caricamento…</div></div><div id="jobs"></div></section>
<section id="detailView" class="hidden"><button id="back" class="back">‹ Torna alla ricerca</button><div class="card"><div id="dCliente" class="detailTitle"></div><div id="dDesc" class="detailDesc"></div><span class="badge">IN LAVORAZIONE</span><img id="dPhoto" class="detailPhoto" alt="Foto ricambio"><div class="grid"><div class="field"><label>Data apertura</label><div id="dApertura" class="box"></div></div><div class="field"><label>DDT / riferimento</label><div id="dDdt" class="box"></div></div></div><div class="field" style="margin-top:12px"><label>Note esistenti</label><div id="dNote" class="box"></div></div><a id="original" class="original">APRI SCHEDA OFFICINA COMPLETA</a><div class="greenpanel"><strong>✓ Completamento lavorazione</strong><div class="count" style="margin:5px 0 0">La data di chiusura viene impostata automaticamente a oggi.</div></div><div class="notes"><label>Note finali (facoltative)</label><textarea id="finalNote" placeholder="Es. sostituiti cuscinetti e tenuta, prova finale OK"></textarea></div><button id="complete" class="complete">✓ COMPLETA LAVORAZIONE</button><div id="msg" class="msg"></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);let rows=[],selected=null,photoMap={};const norm=v=>String(v||'').trim().toUpperCase();function today(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+x}function fmt(v){if(!v)return"—";const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:v}function esc(v){return String(v||'').replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
async function authUI(){const{data:{session}}=await sb.auth.getSession();$('login').classList.toggle('hidden',!!session);$('listView').classList.toggle('hidden',!session);if(session)await load();return session}$('loginBtn').onclick=async()=>{try{$('loginMsg').textContent='Accesso…';const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('loginMsg').textContent='';await authUI()}catch(e){$('loginMsg').textContent='Errore: '+e.message}};
async function load(){
 $('count').textContent='Caricamento lavorazioni…';
 const {data,error}=await sb.from('records').select('id,cliente,telefono,descrizione,statoPratica,dataApertura,docTrasporto,note,scheda_url').eq('statoPratica','In lavorazione').order('updated_at',{ascending:false}).limit(500);
 if(error){$('count').textContent='Errore: '+error.message;return}
 rows=data||[];photoMap={};
 if(rows.length){
   const ids=rows.map(r=>r.id);
   const pr=await sb.from('photos').select('record_id,path').in('record_id',ids);
   if(!pr.error)(pr.data||[]).forEach(p=>{if(!photoMap[p.record_id])photoMap[p.record_id]=p.path});
   await Promise.all(rows.map(async r=>{
     if(photoMap[r.id])return;
     for(const folder of ['records/'+r.id,r.id]){
       const ls=await sb.storage.from('photos').list(folder,{limit:10,sortBy:{column:'created_at',order:'desc'}});
       if(!ls.error){
         const file=(ls.data||[]).find(x=>x.name&&/\.(jpg|jpeg|png|webp|heic)$/i.test(x.name));
         if(file){photoMap[r.id]=folder+'/'+file.name;break}
       }
     }
   }));
 }
 render();
}
function photoUrl(id){
 const path=photoMap[id];if(!path)return "";
 return sb.storage.from('photos').getPublicUrl(path).data.publicUrl||"";
}
function render(){
 const q=norm($('q').value),a=rows.filter(r=>!q||norm([r.cliente,r.descrizione,r.docTrasporto,r.id,r.telefono].join(' ')).includes(q));
 $('count').textContent=a.length+' lavorazioni in corso';
 $('jobs').innerHTML=a.length?a.map(r=>{
   const u=photoUrl(r.id);
   return '<div class="job" role="button" tabindex="0" data-id="'+esc(r.id)+'"><div class="jobtop"><div class="jobmain"><div class="thumbbox">'+(u?'<img class="thumb" src="'+esc(u)+'" alt="Foto ricambio">':'')+'</div><div class="jobtext"><div class="cliente">'+esc(r.cliente||'SENZA CLIENTE')+'</div><div class="desc">'+esc(r.descrizione||'NESSUNA DESCRIZIONE')+'</div><span class="badge">IN LAVORAZIONE</span><div class="meta">'+(r.docTrasporto?'DDT: '+esc(r.docTrasporto)+'<br>':'')+'Aperta: '+esc(fmt(r.dataApertura))+'</div></div></div><div class="arrow">›</div></div></div>'
 }).join(''):'<div class="card empty">Nessuna scheda trovata.</div>';
 document.querySelectorAll('.job').forEach(el=>{
   el.addEventListener('click',()=>openJob(el.dataset.id));
   el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openJob(el.dataset.id)}})
 });
}
$('q').addEventListener('input',render);
function openJob(id){selected=rows.find(r=>r.id===id);if(!selected)return;$('dCliente').textContent=selected.cliente||'SENZA CLIENTE';$('dDesc').textContent=selected.descrizione||'NESSUNA DESCRIZIONE';$('dApertura').textContent=fmt(selected.dataApertura);$('dDdt').textContent=selected.docTrasporto||'—';$('dNote').textContent=selected.note||'—';const dp=$('dPhoto'),pu=photoUrl(id);if(pu){dp.src=pu;dp.style.display='block'}else{dp.removeAttribute('src');dp.style.display='none'};$('original').href=selected.scheda_url||('record.html?id='+encodeURIComponent(id));$('finalNote').value='';$('msg').className='msg';$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');scrollTo(0,0)}$('back').onclick=()=>{$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');selected=null;scrollTo(0,0)};$('finalNote').addEventListener('blur',()=>$('finalNote').value=norm($('finalNote').value));
$('complete').onclick=async()=>{if(!selected)return;const b=$('complete');b.disabled=true;$('msg').className='msg ok';$('msg').textContent='Aggiornamento in corso…';try{const note=norm($('finalNote').value);let merged=selected.note||'';if(note)merged=(merged?merged.trim()+'\n\n':'')+'CHIUSURA '+fmt(today())+': '+note;const patch={statoPratica:'Completata',dataChiusura:today(),updated_at:new Date().toISOString()};if(note)patch.note=merged;const{data,error}=await sb.from('records').update(patch).eq('id',selected.id).eq('statoPratica','In lavorazione').select('id,statoPratica,dataChiusura,note').single();if(error)throw error;if(!data||data.statoPratica!=='Completata'||data.dataChiusura!==today())throw new Error('Verifica aggiornamento non riuscita');$('msg').className='msg ok';$('msg').textContent='✓ LAVORAZIONE COMPLETATA';rows=rows.filter(r=>r.id!==selected.id);setTimeout(()=>{$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');selected=null;render();scrollTo(0,0)},900)}catch(e){$('msg').className='msg err';$('msg').textContent='Errore: '+e.message}finally{b.disabled=false}};authUI();sb.auth.onAuthStateChange((_e,s)=>{if(s)authUI()});
</script></body></html>
