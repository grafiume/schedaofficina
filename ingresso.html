<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>ELIP • Ingresso Officina</title><link rel="apple-touch-icon" href="icons/icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:auto;padding:18px 16px 40px}.head{text-align:center;margin:8px 0 20px}.head img{width:88px;border-radius:12px}.head h1{font-size:24px;margin:10px 0 3px}.head p{margin:0;color:#666}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.step{font-weight:800;margin-bottom:10px}.pick{display:block;width:100%;border:2px dashed #bbb;border-radius:14px;padding:18px;text-align:center;font-weight:700;background:#fafafa}.pick input{display:none}.preview{display:none;width:100%;max-height:230px;object-fit:contain;border-radius:12px;margin-top:12px;background:#eee}label.txt{font-size:13px;font-weight:700;color:#555;display:block;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;padding:13px;border:1px solid #ccc;border-radius:12px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:800;margin-top:12px}.scan{background:#1769e0;color:#fff}.create{background:#ef7d00;color:#fff}.btn:disabled{opacity:.5}.msg{display:none;border-radius:12px;padding:12px;margin-top:12px;font-weight:700}.ok{background:#e9f8ee;color:#176b36}.err{background:#fff0f0;color:#9d2222}.small{font-size:12px;color:#777;margin-top:7px}.open{display:none;text-align:center;margin-top:12px}.fields{display:none}.progress{font-size:13px;text-align:center;color:#555;margin-top:8px}
</style></head><body><div class="wrap"><div class="head"><img src="logo-elip.jpg"><h1>Ingresso Officina</h1><p>Scansiona → controlla → crea</p></div>
<div class="card"><div class="step">1. Documento cliente</div><label class="pick">📄 Scatta foto o scegli dalla libreria<input id="doc" type="file" accept="image/*"></label><img id="docPrev" class="preview"><button id="scan" class="btn scan" disabled>LEGGI DOCUMENTO</button><div id="scanProgress" class="progress"></div><div class="small">La foto del documento serve solo per estrarre i dati e non viene allegata alla scheda.</div></div>
<div id="fields" class="card fields"><div class="step">2. Dati letti — correggi solo se serve</div><label class="txt">Cliente</label><input id="cliente"><label class="txt">Telefono</label><input id="telefono" inputmode="tel"><label class="txt">Tipo macchina / ricambio</label><input id="descrizione"><div class="row"><div><label class="txt">Data apertura</label><input id="dataApertura" type="date"></div><div><label class="txt">Stato</label><select id="stato"><option selected>In lavorazione</option><option>In attesa</option></select></div></div><label class="txt">DDT / riferimento</label><input id="ddt"><label class="txt">Note</label><textarea id="note" rows="2"></textarea></div>
<div id="partCard" class="card fields"><div class="step">3. Foto ricambio</div><label class="pick">⚙️ Scatta foto o scegli dalla libreria<input id="part" type="file" accept="image/*"></label><img id="partPrev" class="preview"><div class="small">Solo questa foto verrà allegata alla scheda.</div><button id="create" class="btn create">CREA SCHEDA</button><div id="msg" class="msg"></div><div id="open" class="open"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6';
let reader;
window.officinaLeggi=async(image)=>{
 if(!reader) reader=await pipeline('image-text-to-text','HuggingFaceTB/SmolVLM-256M-Instruct',{device:'webgpu'});
 const q=[{role:'user',content:[{type:'image',url:image},{type:'text',text:'Read this Italian workshop intake form including handwriting. Return only one line: CLIENTE=... | TELEFONO=... | TIPO=... | DDT=... | NOTE=... . Never guess; leave blank if unreadable.'}]}];
 const r=await reader(q,{max_new_tokens:120});
 const s=JSON.stringify(r);
 const get=k=>{const m=s.match(new RegExp(k+'=([^|\\\\"]*)','i'));return m?m[1].trim():''};
 return {ok:true,data:{cliente:get('CLIENTE'),telefono:get('TELEFONO'),descrizione:get('TIPO'),ddt:get('DDT'),note:get('NOTE')}};
};
</script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),$=id=>document.getElementById(id);function today(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+x}$('dataApertura').value=today();
function prev(i,p){i.onchange=()=>{const f=i.files?.[0];if(!f){p.style.display='none';return}p.src=URL.createObjectURL(f);p.style.display='block'}}prev($('doc'),$('docPrev'));prev($('part'),$('partPrev'));$('doc').addEventListener('change',()=>{$('scan').disabled=!$('doc').files?.[0]});
function toDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Lettura foto fallita'));r.readAsDataURL(file)})}
$('scan').onclick=async()=>{const f=$('doc').files?.[0];if(!f)return;const b=$('scan');b.disabled=true;$('scanProgress').textContent='Analisi intelligente del documento…';try{
 const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Apri prima la Scheda Officina ed effettua l’accesso su questo iPhone.');
 const image=await toDataUrl(f);
 const data=await window.officinaLeggi(image); const error=null;
 if(error)throw error;if(!data?.ok)throw new Error(data?.error==='AI_NOT_CONFIGURED'?'Lettura AI non ancora configurata sul server.':(data?.detail||data?.error||'Lettura AI fallita.'));
 const x=data.data||{};$('cliente').value=x.cliente||'';$('telefono').value=x.telefono||'';$('descrizione').value=x.descrizione||'';$('ddt').value=x.ddt||'';$('note').value=x.note||'';
 $('fields').style.display='block';$('partCard').style.display='block';$('scanProgress').textContent='✓ Dati letti dall’AI. Controlla e correggi solo se necessario.';
}catch(e){$('fields').style.display='none';$('partCard').style.display='none';$('scanProgress').textContent='Errore lettura AI: '+(e.message||e)}finally{b.disabled=false}};
function msg(t,ok){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block'}$('create').onclick=async()=>{const btn=$('create'),desc=$('descrizione').value.trim(),file=$('part').files?.[0];if(!desc)return msg('Controlla il tipo macchina / ricambio.',false);if(!file)return msg('Inserisci la foto del ricambio.',false);btn.disabled=true;msg('Creazione in corso…',true);try{const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Apri prima la Scheda Officina ed effettua l’accesso su questo iPhone.');const payload={cliente:$('cliente').value.trim()||null,telefono:$('telefono').value.trim()||null,descrizione:desc,dataApertura:$('dataApertura').value||today(),statoPratica:$('stato').value,docTrasporto:$('ddt').value.trim()||null,note:$('note').value.trim()||null};const {data:r,error:e}=await sb.from('records').insert(payload).select('id').single();if(e)throw e;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=r.id+'/'+Date.now()+'.'+ext;const up=await sb.storage.from('photos').upload(path,file,{upsert:false,cacheControl:'0',contentType:file.type||'image/jpeg'});if(up.error){await sb.from('records').delete().eq('id',r.id);throw up.error}const ph=await sb.from('photos').insert({record_id:r.id,path});if(ph.error){await sb.storage.from('photos').remove([path]);await sb.from('records').delete().eq('id',r.id);throw ph.error}msg('✓ SCHEDA CREATA — In lavorazione',true);$('open').innerHTML='<a href="record.html?id='+encodeURIComponent(r.id)+'">Apri scheda appena creata</a>';$('open').style.display='block'}catch(e){msg('Errore: '+(e.message||e),false)}finally{btn.disabled=false}};
</script></body></html>
