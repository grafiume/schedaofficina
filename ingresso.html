<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ELIP • Ingresso Officina</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px 16px 40px}.head{text-align:center;margin:8px 0 20px}.head img{width:88px;border-radius:12px}.head h1{font-size:24px;margin:10px 0 3px}.head p{margin:0;color:#666}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.step{font-weight:800;margin-bottom:10px}
.pick{display:block;width:100%;border:2px dashed #bbb;border-radius:14px;padding:18px;text-align:center;font-weight:700;background:#fafafa}.pick input{display:none}
.preview{display:none;width:100%;max-height:230px;object-fit:contain;border-radius:12px;margin-top:12px;background:#eee}
label.txt{font-size:13px;font-weight:700;color:#555;display:block;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;padding:13px;border:1px solid #ccc;border-radius:12px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.create{width:100%;border:0;border-radius:15px;padding:17px;font-size:18px;font-weight:800;background:#ef7d00;color:#fff;margin-top:14px}.create:disabled{opacity:.5}
.msg{display:none;border-radius:12px;padding:12px;margin-top:12px;font-weight:700}.ok{background:#e9f8ee;color:#176b36}.err{background:#fff0f0;color:#9d2222}.small{font-size:12px;color:#777;margin-top:7px}.open{display:none;text-align:center;margin-top:12px}
</style>
</head>
<body><div class="wrap">
<div class="head"><img src="logo-elip.jpg" alt="ELIP"><h1>Ingresso Officina</h1><p>Foto → controlla i dati → crea scheda</p></div>
<div class="card"><div class="step">1. Foto scheda / DDT</div><label class="pick">📄 Scatta foto o scegli dalla libreria<input id="doc" type="file" accept="image/*"></label><img id="docPrev" class="preview"><div class="small">Serve solo per leggere/controllare i dati. Non viene allegata alla scheda.</div></div>
<div class="card"><div class="step">2. Foto ricambio</div><label class="pick">⚙️ Scatta foto o scegli dalla libreria<input id="part" type="file" accept="image/*"></label><img id="partPrev" class="preview"><div class="small">Questa è la foto che verrà salvata nella scheda.</div></div>
<div class="card"><div class="step">3. Controlla o correggi i dati</div>
<label class="txt">Cliente</label><input id="cliente" autocomplete="organization">
<label class="txt">Telefono</label><input id="telefono" inputmode="tel">
<label class="txt">Tipo macchina / ricambio</label><input id="descrizione" placeholder="es. Indotto">
<div class="row"><div><label class="txt">Data apertura</label><input id="dataApertura" type="date"></div><div><label class="txt">Stato</label><select id="stato"><option selected>In lavorazione</option><option>In attesa</option></select></div></div>
<label class="txt">DDT / riferimento</label><input id="ddt">
<label class="txt">Note</label><textarea id="note" rows="2"></textarea>
<button id="create" class="create">CREA SCHEDA</button><div id="msg" class="msg"></div><div id="open" class="open"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
function today(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+x}$('dataApertura').value=today();
function preview(inp,img){inp.addEventListener('change',()=>{const f=inp.files?.[0];if(!f){img.style.display='none';return}img.src=URL.createObjectURL(f);img.style.display='block'})}preview($('doc'),$('docPrev'));preview($('part'),$('partPrev'));
function message(t,ok){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block'}
$('create').onclick=async()=>{const btn=$('create'),desc=$('descrizione').value.trim(),file=$('part').files?.[0];if(!desc)return message('Inserisci il tipo macchina / ricambio.',false);if(!file)return message('Inserisci la foto del ricambio.',false);
btn.disabled=true;message('Creazione in corso…',true);try{
const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Devi prima accedere alla Scheda Officina su questo iPhone.');
const payload={cliente:$('cliente').value.trim()||null,telefono:$('telefono').value.trim()||null,descrizione:desc,dataApertura:$('dataApertura').value||today(),statoPratica:$('stato').value,docTrasporto:$('ddt').value.trim()||null,note:$('note').value.trim()||null};
const {data:r,error:e}=await sb.from('records').insert(payload).select('id').single();if(e)throw e;
const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=r.id+'/'+Date.now()+'.'+ext;const up=await sb.storage.from('photos').upload(path,file,{upsert:false,cacheControl:'0',contentType:file.type||'image/jpeg'});if(up.error){await sb.from('records').delete().eq('id',r.id);throw up.error}
const ph=await sb.from('photos').insert({record_id:r.id,path});if(ph.error){await sb.storage.from('photos').remove([path]);await sb.from('records').delete().eq('id',r.id);throw ph.error}
message('✓ SCHEDA CREATA — In lavorazione',true);const u='record.html?id='+encodeURIComponent(r.id);$('open').innerHTML='<a href="'+u+'">Apri scheda appena creata</a>';$('open').style.display='block';
}catch(e){message('Errore: '+(e.message||e),false)}finally{btn.disabled=false}};
</script></body></html>
